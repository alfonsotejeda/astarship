services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astarship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astarship}
      POSTGRES_DB: ${POSTGRES_DB:-astarship}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astarship} -d ${POSTGRES_DB:-astarship}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astarship}:${POSTGRES_PASSWORD:-astarship}@database:5432/${POSTGRES_DB:-astarship}
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/srv/app:ro

volumes:
  pgdata:
